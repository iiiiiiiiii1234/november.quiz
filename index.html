<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي نوفمبر المجيد - مسابقة الذاكرة الوطنية</title>
    <style>
        :root {
            --primary-color: #006233;
            --accent-color: #d21034;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #006233 0%, #1a252f 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color), white);
        }
        h1 { color: var(--primary-color); font-size: 24px; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #eef2f3;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .score { color: var(--accent-color); }
        .q-progress { color: var(--primary-color); }
        .question-box {
            font-size: 19px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9fbfd;
            border-right: 5px solid var(--primary-color);
            border-radius: 5px;
            text-align: right;
            line-height: 1.5;
        }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            background-color: #ffffff;
            color: #333;
            border: 2px solid #e0e0e0;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }
        .btn:hover:not(:disabled) {
            background-color: #f1f8f5;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        .btn.correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724 !important; }
        .btn.wrong { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24 !important; }
        .explanation {
            margin-top: 20px;
            padding: 12px;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 8px;
            color: #856404;
            font-size: 14px;
            display: none;
            text-align: right;
        }
        .next-btn {
            margin-top: 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            width: 100%;
            font-weight: bold;
        }
        .result-screen { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div id="quiz-screen">
        <h1>🇩🇿 تحدي ذاكرة نوفمبر 🇩🇿</h1>
        <div class="subtitle">مسابقة وطنية تفاعلية لإحياء الثورة التحريرية</div>
        <div class="stats-bar">
            <span class="q-progress" id="q-progress">السؤال 1 من 10</span>
            <span class="score" id="score-text">النقاط: 0</span>
        </div>
        <div class="question-box" id="question-text">جاري تحميل السؤال...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="explanation" id="explanation-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>
    <div class="result-screen" id="result-screen">
        <h1>🏆 نتيجة التحدي المجيد</h1>
        <p id="final-message" style="font-size: 18px; margin: 20px 0; font-weight: bold;"></p>
        <button class="next-btn" style="display: block;" onclick="restartQuiz()">إعادة التحدي 🔄</button>
    </div>
</div>
<script>
    const questions = [
        { q: "في أي سنة اندلعت ثورة التحرير الجزائرية الخالدة ضد الاستعمار الفرنسي؟", options: ["1945", "1952", "1954", "1962"], answer: 2, exp: "اندلعت الثورة التحريرية المباركة في الأول من نوفمبر 1954." },
        { q: "ما هي الوثيقة الأساسية التي وجهت وخططت لاندلاع الثورة وحددت أهدافها؟", options: ["بيان أول نوفمبر", "ميثاق طرابلس", "اتفاقيات إيفيان", "مؤتمر الصومام"], answer: 0, exp: "بيان أول نوفمبر 1954 هو النداء التاريخي الذي وجهه الشعب الجزائري لإعلان الكفاح المسلح." },
        { q: "من هو البطل الشهيد قائد الولاية التاريخية الأولى (الأوراس الأبراج) ومفجرها؟", options: ["العربي بن مهيدي", "مصطفى بن بولعيد", "ديدوش مراد", "كريم بلقاسم"], answer: 1, exp: "مصطفى بن بولعيد كان من أبرز تفجيري الثورة وقائداً تاريخياً فذاً في الأوراس." },
        { q: "في أي تاريخ انعقد مؤتمر الصومام التاريخي لتنظيم الثورة سياسياً وعسكرياً؟", options: ["1 نوفمبر 1954", "8 ماي 1945", "20 أوت 1956", "19 مارس 1962"], answer: 2, exp: "انعقد مؤتمر الصومام في 20 أوت 1956 بقرية إفري أوزقان في منطقة القبائل." },
        { q: "من هو صاحب العبارة الخالدة: 'ألقوا بالثورة إلى الشارع سيحتضنها الشعب'؟", options: ["عبان رمضان", "العربي بن مهيدي", "زيغود يوسف", "حسيبة بن بوعلي"], answer: 1, exp: "قالها البطل الرمز العربي بن مهيدي مؤكداً على ثقة الثورة المطلقة بالشعب الجزائري." },
        { q: "ما هي الولاية التاريخية التي شهدت أحداث الهجومات الشهيرة في الشمال القسنطيني 20 أوت 1955؟", options: ["الولاية الأولى", "الولاية الثالثة", "الولاية الثانية", "الولاية الخامسة"], answer: 2, exp: "هجومات الشمال القسنطيني قادها زيغود يوسف في الولاية التاريخية الثانية." },
        { q: "ما هو التنظيم النقابي الذي تم تأسيسه سنة 1956 ودعم الثورة بجدارة؟", options: ["الاتحاد العام للعمال الجزائريين", "الاتحاد العام للطلاب الجزائريين", "التجار الجزائريين", "المزارعين الجزائريين"], answer: 0, exp: "الاتحاد العام للعمال الجزائريين (UGTA) الذي تأسس في 24 فيفري 1956." },
        { q: "من هي البطلة الشهيدة التي استشهدت في تفجير منزلها بالقصبة مع رفاقها سنة 1957؟", options: ["جميلة بوحيرد", "حسيبة بن بوعلي", "لستيتة بريزينة", "زهرة ظريف"], answer: 1, exp: "الشهيدة حسيبة بن بوعلي استشهدت بمعية علي لابوانت وبتت البهلوان وعمر القلاّل." },
        { q: "متى تم إقرار وقف إطلاق النار رسمياً إثر توقيع اتفاقيات إيفيان؟", options: ["5 جويلية 1962", "1 نوفمبر 1954", "19 مارس 1962", "20 أوت 1956"], answer: 2, exp: "تم توقيع اتفاقيات إيفيان وإقرار وقف إطلاق النار في 19 مارس 1962." },
        { q: "في أي يوم استرجعت الجزائر سيادتها الوطنية وأعلنت استقلالها رسمياً؟", options: ["1 نوفمبر 1954", "5 جويلية 1962", "19 مارس 1962", "1 نوفمبر 1962"], answer: 1, exp: "استرجعت الجزائر سيادتها في 5 جويلية 1962 تخليداً لذكرى دخول الفرنسيين للجزائر سنة 1830." }
    ];

    let currentQ = 0, score = 0, answered = false;
    function loadQuestion() {
        answered = false;
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        let q = questions[currentQ];
        document.getElementById("q-progress").innerText = `السؤال ${currentQ + 1} من ${questions.length}`;
        document.getElementById("score-text").innerText = `النقاط: ${score}`;
        document.getElementById("question-text").innerText = q.q;
        let container = document.getElementById("options-container");
        container.innerHTML = "";
        q.options.forEach((opt, idx) => {
            let btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx, btn);
            container.appendChild(btn);
        });
    }
    function selectAnswer(selectedIdx, btnElement) {
        if (answered) return;
        answered = true;
        let q = questions[currentQ], buttons = document.querySelectorAll(".btn");
        if (selectedIdx === q.answer) {
            btnElement.classList.add("correct");
            score += 10;
            document.getElementById("score-text").innerText = `النقاط: ${score}`;
        } else {
            btnElement.classList.add("wrong");
            buttons[q.answer].classList.add("correct");
        }
        let expBox = document.getElementById("explanation-box");
        expBox.innerHTML = `<strong>💡 معلومة تاريخية:</strong> ${q.exp}`;
        expBox.style.display = "block";
        document.getElementById("next-btn").style.display = "block";
    }
    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) { loadQuestion(); } else { showResults(); }
    }
    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        let resultScreen = document.getElementById("result-screen");
        resultScreen.style.display = "block";
        let msg = `لقد جمعت ${score} من ${questions.length * 10} نقطة!<br>`;
        if (score === questions.length * 10) { msg += "🌟 مذهل! أنتِ باحثة تاريخية حقيقية، علامة كاملة وتحية لروح نوفمبر المجيد! 🇩🇿"; }
        else if (score >= 60) { msg += "👏 أحسنتِ جداً! حصيلتك التاريخية ممتازة ومليئة بروح الوطنية."; }
        else { msg += "📚 محاولة طيبة، تاريخ الجزائر حافل بالعبر والمجد ويستحق الاستكشاف أكثر!"; }
        document.getElementById("final-message").innerHTML = msg;
    }
    function restartQuiz() {
        currentQ = 0; score = 0;
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        loadQuestion();
    }
    loadQuestion();
</script>
</body>
</html>
